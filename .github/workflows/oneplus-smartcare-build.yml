name: OnePlus SmartCare Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "oneplus-smartcare-suite/android/**"
      - ".github/workflows/oneplus-smartcare-build.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: oneplus-smartcare-suite/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SmartCare-debug-apk
          path: oneplus-smartcare-suite/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
