name: OnePlus SmartCare Android APK

on:
  push:
    paths:
      - "oneplus-smartcare/**"
      - ".github/workflows/oneplus-smartcare-android.yml"
  pull_request:
    paths:
      - "oneplus-smartcare/**"
      - ".github/workflows/oneplus-smartcare-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p oneplus-smartcare/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SmartCare-debug-apk
          path: oneplus-smartcare/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
