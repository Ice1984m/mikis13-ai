name: Mikis13 Docker CI

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.ci'
      - 'compose.ci.yaml'
      - '*.js'
      - 'api/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-cross-device.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker-image bouwen
        run: docker compose -f compose.ci.yaml build --pull

      - name: Tests uitvoeren
        run: docker compose -f compose.ci.yaml run --rm check
