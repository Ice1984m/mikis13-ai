name: Mikis13 AI Android build en releasecontrole

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: mikis13-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Testen en APK/AAB bouwen
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Java 17 installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK installeren
        uses: android-actions/setup-android@v3

      - name: Projectconfiguratie controleren
        working-directory: android-app
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mikis13/ai/MainActivity.java
          grep -q 'applicationId "com.mikis13.ai"' app/build.gradle
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

      - name: Gradle-configuratie evalueren
        working-directory: android-app
        run: gradle --no-daemon --stacktrace tasks

      - name: Android lint uitvoeren
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Unit-tests uitvoeren wanneer aanwezig
        working-directory: android-app
        shell: bash
        run: |
          set -Eeuo pipefail
          if gradle --no-daemon tasks --all | grep -q 'testDebugUnitTest'; then
            gradle --no-daemon --stacktrace :app:testDebugUnitTest
          else
            echo "Geen Android unit-tests geconfigureerd; build- en lintcontroles blijven verplicht."
          fi

      - name: Debug APK bouwen
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Release AAB bouwen (unsigned validatiebestand)
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:bundleRelease

      - name: APK en AAB controleren
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          AAB="android-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK"
          unzip -t "$AAB"
          mkdir -p dist
          cp "$APK" dist/mikis13-ai-debug.apk
          cp "$AAB" dist/mikis13-ai-release-unsigned.aab
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Release-keystore instellen
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          test -s "$RUNNER_TEMP/signing/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Ondertekende APK en AAB bouwen
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        working-directory: android-app
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Ondertekende releasebestanden controleren
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          AAB="android-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          apksigner verify --verbose "$APK"
          cp "$APK" dist/mikis13-ai-release.apk
          cp "$AAB" dist/mikis13-ai-release.aab
          (cd dist && sha256sum mikis13-ai-release.apk mikis13-ai-release.aab > RELEASE-SHA256SUMS.txt)

      - name: Buildresultaten bewaren
        uses: actions/upload-artifact@v4
        with:
          name: mikis13-ai-android-build
          path: dist/
          if-no-files-found: error
          retention-days: 30
